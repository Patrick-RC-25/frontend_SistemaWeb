<aside class="sidebar d-none d-md-flex flex-column">
  <div class="sidebar-brand px-3 pt-4 pb-3">
    <app-logo [light]="true" />
  </div>

  <nav class="sidebar-nav flex-grow-1 px-2 mt-2">
    @for (item of navItems; track item.path) {
      <a
        class="nav-item d-flex align-items-center gap-3"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/inicio' }"
      >
        <i class="bi" [class]="item.icon"></i>
        <span class="flex-grow-1">{{ item.label }}</span>
        @if (item.path === '/alertas' && activeAlerts() > 0) {
          <span class="nav-badge">{{ activeAlerts() }}</span>
        }
      </a>
    }
  </nav>

  <div class="sidebar-footer p-3">
    @if (email(); as e) {
      <div class="user-card d-flex align-items-center gap-2">
        <div class="user-avatar">{{ initials() }}</div>
        <div class="min-w-0 flex-grow-1">
          <div class="user-name truncate">{{ displayName() }}</div>
          <div class="user-meta truncate">{{ e }}</div>
        </div>
        <button
          type="button"
          class="btn btn-sm btn-link text-white-50 p-1"
          (click)="logout()"
          title="Cerrar sesión"
          aria-label="Cerrar sesión"
        >
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    }
  </div>
</aside>
